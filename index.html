<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>GroVee TV Live</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/hls.js@1.4.12/dist/hls.min.js"></script>
    <script src="https://unpkg.com/pako@2.1.0/dist/pako.min.js"></script>
    <style>
        :root {
            --bg: #050505;
            --card: #111111;
            --accent: #F59E0B;
            --accent2: #D97706;
            --success: #22C55E;
            --warn: #EAB308;
            --danger: #EF4444;
            --glass: rgba(0,0,0,0.55);
            --text: #fff;
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:'Rubik',sans-serif; }
        button { font:inherit; }
        
        #splash { position:fixed; inset:0; z-index:9999; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 20px; transition: opacity .6s ease; overflow:auto; }
        #splash.hide { opacity:0; pointer-events:none; }
        .splash-panel {
            width: min(100%, 420px);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .splash-ring { width:56px; height:56px; border:3px solid rgba(245,158,11,0.2); border-top-color:var(--accent); border-radius:50%; animation:spin .9s linear infinite; flex-shrink:0; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .splash-text { margin-top:20px; color:var(--accent); font-size:18px; font-weight:700; }
        .splash-explain {
            margin-top:14px;
            max-width:360px;
            text-align:center;
            color:#aaa;
            font-size:13px;
            line-height:1.55;
            font-weight:400;
        }
        .splash-sub { color:#666; font-size:12px; margin-top:12px; min-height:18px; text-align:center; }
        #splash-sources {
            margin-top:20px;
            width:100%;
            max-height:42dvh;
            overflow-y:auto;
            display:flex;
            flex-direction:column;
            gap:6px;
            scrollbar-width:thin;
        }
        .splash-src-row {
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:10px;
            padding:8px 12px;
            border-radius:10px;
            background:rgba(255,255,255,0.04);
            border:1px solid rgba(255,255,255,0.06);
            font-size:12px;
            opacity:0.35;
            transition:opacity .25s ease, border-color .25s ease, background .25s ease;
        }
        .splash-src-row.active {
            opacity:1;
            border-color:rgba(245,158,11,0.45);
            background:rgba(245,158,11,0.08);
        }
        .splash-src-row.done { opacity:0.9; }
        .splash-src-row.fail { opacity:0.7; border-color:rgba(239,68,68,0.35); }
        .splash-src-name { font-weight:600; color:#eee; }
        .splash-src-status { color:#888; font-size:11px; white-space:nowrap; }
        .splash-src-row.active .splash-src-status { color:var(--accent); }
        .splash-src-row.done .splash-src-status { color:var(--success); }
        .splash-src-row.fail .splash-src-status { color:var(--danger); }
        @media (min-width: 900px) {
            .splash-panel { width: min(100%, 780px); }
            .splash-text { font-size: 28px; margin-top: 12px; }
            .splash-explain { max-width: 560px; font-size: 15px; }
            #splash-sources {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px 12px;
                max-height: min(48vh, 360px);
                margin-top: 28px;
            }
            .splash-src-row { padding: 10px 14px; font-size: 13px; }
        }
        
        #scan-progress { position:fixed; top:0; left:0; right:0; height:2px; z-index:150; background:rgba(255,255,255,0.05); opacity:0; transition:opacity .3s ease; }
        #scan-progress.show { opacity:1; }
        .scan-progress-bar { height:100%; background:linear-gradient(90deg, var(--accent), var(--accent2)); width:0%; transition:width .3s ease; }
        
        /* Header - שורה אחת עם כל האלמנטים */
        #top-header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 110;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 10px;
            padding-top: max(8px, env(safe-area-inset-top));
            background: rgba(5,5,5,0.92);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            transition: transform .3s ease, opacity .3s ease;
        }
        #top-header.hidden { transform: translateY(-100%); opacity: 0; pointer-events: none; }
        
        .header-left { display: flex; align-items: center; gap: 4px; flex-shrink: 0; min-width: 0; }
        .header-title { font-size: 11px; color: #fff; opacity: 0.85; white-space: nowrap; }
        
        /* כרטיס ערוץ מאוחד בתחתית־ימין */
        #channel-chip {
            position: fixed;
            bottom: max(16px, env(safe-area-inset-bottom));
            right: 12px;
            left: auto;
            top: auto;
            z-index: 90;
            max-width: min(78%, 320px);
            padding: 12px 14px;
            border-radius: 16px;
            background: rgba(0,0,0,0.82);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,0.14);
            pointer-events: auto;
            box-shadow: 0 8px 28px rgba(0,0,0,0.45);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        #channel-chip-name {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }
        #channel-chip-meta {
            font-size: 10px;
            color: #aaa;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        #channel-chip-epg {
            font-size: 11px;
            color: #e5e5e5;
            line-height: 1.35;
            display: none;
        }
        #channel-chip-epg.show { display: block; }
        #channel-chip-epg .epg-now-label {
            color: var(--accent);
            font-weight: 700;
            font-size: 9px;
            letter-spacing: 0.04em;
            margin-left: 4px;
        }
        #channel-chip-source {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
            padding: 6px 10px;
            border-radius: 10px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            color: #ddd;
            text-decoration: none;
            font-size: 11px;
            font-weight: 600;
            max-width: 100%;
            align-self: flex-start;
        }
        #channel-chip-source i { color: var(--accent); font-size: 10px; }
        #channel-chip-source:active { background: rgba(245,158,11,0.2); color: var(--accent); }
        .chip-live {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            color: #888;
        }
        .chip-live i { font-size: 9px; color: var(--success); }
        
        /* כפתור לוח שידורים צף */
        #epg-fab {
            position: fixed;
            bottom: max(150px, calc(env(safe-area-inset-bottom) + 130px));
            right: 14px;
            z-index: 95;
            width: 52px;
            height: 52px;
            border-radius: 16px;
            border: 1px solid rgba(245,158,11,0.45);
            background: linear-gradient(145deg, rgba(245,158,11,0.95), rgba(217,119,6,0.9));
            color: #111;
            font-size: 20px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(245,158,11,0.35);
            transition: transform .2s ease, opacity .2s ease;
        }
        #epg-fab.show { display: flex; }
        #epg-fab:active { transform: scale(0.94); }
        #epg-fab .epg-fab-pulse {
            position: absolute;
            inset: -4px;
            border-radius: 18px;
            border: 2px solid rgba(245,158,11,0.5);
            animation: epg-pulse 2s ease-out infinite;
            pointer-events: none;
        }
        @keyframes epg-pulse {
            0% { transform: scale(1); opacity: 0.7; }
            100% { transform: scale(1.25); opacity: 0; }
        }
        
        #cat-bar { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
        #cat-bar::-webkit-scrollbar { display: none; }
        .cat-pill { flex-shrink: 0; padding: 4px 12px; border-radius: 12px; font-size: 11px; font-weight: 500; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.06); cursor: pointer; transition: all .25s ease; white-space: nowrap; }
        .cat-pill:hover { background: rgba(255,255,255,0.14); }
        .cat-pill.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }
        
        .header-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
        .header-pill { padding: 4px 8px; border-radius: 12px; font-size: 10px; font-weight: 600; background: rgba(255,255,255,0.08); color: #fff; white-space: nowrap; }
        #auto-scroll-btn { padding: 4px 8px; border: none; border-radius: 12px; background: rgba(255,255,255,0.08); color: #fff; cursor: pointer; font-size: 10px; font-weight: 700; transition: all .25s ease; white-space: nowrap; }
        #auto-scroll-btn.active { background: var(--accent); color: #000; }
        .header-settings-btn { width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all .25s ease; color: #fff; font-size: 13px; flex-shrink: 0; }
        .header-settings-btn:hover { background: rgba(255,255,255,0.15); transform: scale(1.1); }
        
        #scroller { height:100%; height:100dvh; width:100%; overflow-y:scroll; overflow-x:hidden; scroll-snap-type:y mandatory; scrollbar-width:none; -webkit-overflow-scrolling:touch; padding-top: 0; }
        #scroller::-webkit-scrollbar { display:none; }
        .slide { height:100%; min-height:100dvh; min-height:100svh; width:100%; max-width:100%; scroll-snap-align:start; position:relative; overflow:hidden; background:#000; }
        .slide video { width:100%; height:100%; object-fit:contain; background:#000; }
        .slide-bg { position:absolute; inset:0; background-size:cover; background-position:center; filter:blur(30px) brightness(0.3); transform:scale(1.2); opacity:1; transition:opacity .5s ease; }
        
        .overlay-top { position:absolute; top:0; left:0; right:0; padding:12px 16px; padding-top:max(12px, env(safe-area-inset-top)); background:linear-gradient(to bottom, rgba(0,0,0,0.55) 0%, transparent 100%); z-index:10; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
        @media (max-width: 768px) {
            .header-left { max-width: 56px; }
            .cat-pill { padding: 4px 10px; font-size: 10px; }
            .side-actions { bottom: 200px; left: 8px; gap: 14px; }
            .side-btn { width: 42px; height: 42px; font-size: 17px; }
            #channel-chip { max-width: calc(100% - 76px); bottom: max(12px, env(safe-area-inset-bottom)); }
            #epg-fab { bottom: max(130px, calc(env(safe-area-inset-bottom) + 110px)); width: 48px; height: 48px; }
            .overlay-top { padding-top: max(56px, calc(env(safe-area-inset-top) + 48px)); }
        }
        .overlay-bottom { display: none !important; }
        
        .side-actions { position:absolute; left:12px; bottom:200px; z-index:12; display:flex; flex-direction:column; gap:20px; align-items:center; opacity:1; transition:opacity .25s ease; }
        .side-btn { width:48px; height:48px; border-radius:50%; background:var(--glass); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,0.1); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all .25s ease; color:#fff; font-size:20px; }
        .side-btn:hover { background:rgba(255,255,255,0.15); transform:scale(1.1); }
        .side-btn.active { color:var(--accent); border-color:var(--accent); }
        .side-btn-label { font-size:10px; color:#aaa; margin-top:2px; text-align:center; direction:ltr; }
        
        .health-badge { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600; }
        .health-fast { background:rgba(34,197,94,0.2); color:var(--success); }
        .health-slow { background:rgba(234,179,8,0.2); color:var(--warn); }
        .health-dead { background:rgba(239,68,68,0.2); color:var(--danger); }
        .health-unknown { background:rgba(255,255,255,0.1); color:#888; }
        .health-dot { width:6px; height:6px; border-radius:50%; }
        .health-fast .health-dot { background:var(--success); animation:pulse-dot 1.5s infinite; }
        .health-slow .health-dot { background:var(--warn); }
        .health-dead .health-dot { background:var(--danger); }
        .health-unknown .health-dot { background:#666; }
        @keyframes pulse-dot { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
        
        .epg-ticker-wrap { overflow:hidden; white-space:nowrap; direction:ltr; position:relative; mask-image:linear-gradient(to right, transparent 0%, black 8%, black 92%, transparent 100%); -webkit-mask-image:linear-gradient(to right, transparent 0%, black 8%, black 92%, transparent 100%); }
        .epg-ticker-inner { display:inline-block; animation:scroll-ticker 18s linear infinite; }
        @keyframes scroll-ticker { 0% { transform:translateX(100%); } 100% { transform:translateX(-100%); } }
        
        .empty-state { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; min-height:100dvh; gap:16px; color:#666; }
        .empty-state i { font-size:48px; color:#333; }
        
        .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,0.8); backdrop-filter:blur(8px); z-index:200; display:flex; align-items:flex-end; justify-content:center; transition:opacity .3s ease; }
        .modal-backdrop.hide { opacity:0; pointer-events:none; }
        .modal-sheet { width:100%; max-width:480px; background:#1a1a1a; border-radius:20px 20px 0 0; padding:24px; max-height:80dvh; overflow-y:auto; transform:translateY(0); transition:transform .35s cubic-bezier(0.32,0.72,0,1); }
        .modal-backdrop.hide .modal-sheet { transform:translateY(100%); }
        .modal-handle { width:40px; height:4px; background:#444; border-radius:4px; margin:0 auto 20px; }
        
        #toast {
            position:fixed;
            top:50%;
            left:50%;
            bottom:auto;
            transform:translate(-50%, -40%) scale(0.96);
            background:rgba(30,30,30,0.95);
            backdrop-filter:blur(12px);
            border:1px solid rgba(255,255,255,0.1);
            padding:12px 22px;
            border-radius:14px;
            font-size:13px;
            z-index:300;
            opacity:0;
            transition:all .3s ease;
            pointer-events:none;
            max-width:min(90vw, 340px);
            text-align:center;
            box-shadow:0 12px 40px rgba(0,0,0,0.45);
        }
        #toast.show { opacity:1; transform:translate(-50%, -50%) scale(1); }
        
        .block-toggle { display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.06); }
        .toggle-switch { width:44px; height:24px; background:#333; border-radius:12px; position:relative; cursor:pointer; transition:background .25s ease; flex-shrink:0; }
        .toggle-switch.on { background:var(--accent); }
        .toggle-switch::after { content:''; position:absolute; top:2px; inset-inline-start:2px; width:20px; height:20px; background:#fff; border-radius:50%; transition:transform .25s ease; }
        .toggle-switch.on::after { transform:translateX(20px); }
        [dir="rtl"] .toggle-switch.on::after { transform:translateX(-20px); }
        
        .video-loader { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:4; }
        .video-spinner { width:40px; height:40px; border:3px solid rgba(245,158,11,0.2); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
        
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 13px; color: #888; margin-bottom: 6px; font-weight: 600; }
        .input-group input, .input-group textarea { width: 100%; padding: 10px 12px; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; background: rgba(255,255,255,0.05); color: #fff; font-size: 14px; font-family: inherit; }
        .input-group input:focus, .input-group textarea:focus { outline: none; border-color: var(--accent); }
        
        @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation-duration:0.01ms !important; transition-duration:0.01ms !important; } }
    </style>
</head>
<body>
<div id="splash">
    <div class="splash-panel">
        <div class="splash-ring"></div>
        <div class="splash-text">GroVee TV Live</div>
        <p class="splash-explain">סורק מאגרים ציבוריים ומציג <b style="color:#ccc;">רק שידורים שעובדים</b>. ערוצים מופיעים ברגע שנמצאו — בלי כרטיסים ריקים.</p>
        <div id="splash-sources"></div>
        <div class="splash-sub" id="splash-status">מתחיל סריקת מאגרים...</div>
    </div>
</div>
<div id="scan-progress"><div class="scan-progress-bar" id="scan-bar"></div></div>

<div id="top-header">
    <div class="header-left">
        <span class="header-title"><span id="header-channel-number">0</span>/<span id="header-channel-total">0</span></span>
    </div>
    <div id="cat-bar"></div>
    <div class="header-actions">
        <button id="auto-scroll-btn" onclick="toggleAutoScroll()">אוטו</button>
        <div class="header-pill" id="auto-countdown">כבוי</div>
        <button class="header-settings-btn" onclick="toggleSettings()" aria-label="הגדרות"><i class="fas fa-gear"></i></button>
    </div>
</div>

<div id="channel-chip" aria-live="polite">
    <div id="channel-chip-name">טעינה...</div>
    <div id="channel-chip-meta"></div>
    <div id="channel-chip-epg"></div>
    <a id="channel-chip-source" class="source-link" href="#" target="_blank" rel="noopener noreferrer" style="display:none;">
        <i class="fas fa-link"></i>
        <span id="channel-chip-source-label">מקור</span>
    </a>
</div>

<button id="epg-fab" onclick="openEpgSheet()" aria-label="לוח שידורים" title="לוח שידורים">
    <span class="epg-fab-pulse"></span>
    <i class="fas fa-calendar-days"></i>
</button>

<div id="scroller"></div>

<!-- Settings Modal -->
<div class="modal-backdrop hide" id="settings-modal">
    <div class="modal-sheet">
        <div class="modal-handle"></div>
        <h2 style="font-size:18px;font-weight:700;margin-bottom:20px;"><i class="fas fa-sliders" style="color:var(--accent);margin-left:8px;"></i>הגדרות ממיר</h2>
        
        <div style="margin-bottom:20px;">
            <div style="font-size:13px;color:#888;margin-bottom:10px;font-weight:600;">קטגוריות מוצגות <span style="font-weight:400;color:#666;">(כתום = מוצג)</span></div>
            <div id="block-list"></div>
        </div>
        
        <div style="margin-bottom:20px;">
            <div style="font-size:13px;color:#888;margin-bottom:10px;font-weight:600;">שפות מוצגות <span style="font-weight:400;color:#666;">(כתום = מוצג)</span></div>
            <div id="lang-list"></div>
        </div>
        
        <div style="margin-bottom:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.1);">
            <div style="font-size:13px;color:var(--accent);margin-bottom:12px;font-weight:700;"><i class="fas fa-plus-circle" style="margin-left:6px;"></i>הוספת ערוצים מותאמים</div>
            <div class="input-group">
                <label>שם ערוץ</label>
                <input type="text" id="custom-channel-name" placeholder="לדוגמה: ערוץ הספורט שלי">
            </div>
            <div class="input-group">
                <label>כתובת זרימה (URL)</label>
                <input type="text" id="custom-channel-url" placeholder="https://example.com/stream.m3u8">
            </div>
            <div class="input-group">
                <label>לוגו (אופציונלי)</label>
                <input type="text" id="custom-channel-logo" placeholder="https://example.com/logo.png">
            </div>
            <button onclick="addCustomChannel()" style="width:100%;padding:12px;border-radius:12px;background:var(--accent);color:#000;font-weight:700;border:none;cursor:pointer;font-family:inherit;font-size:14px;margin-top:8px;">
                <i class="fas fa-plus" style="margin-left:6px;"></i>הוסף ערוץ
            </button>
        </div>
        
        <div style="margin-bottom:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.1);">
            <div style="font-size:13px;color:#888;margin-bottom:10px;font-weight:600;">הוספה מרובה (JSON)</div>
            <div class="input-group">
                <label>הדבק רשימת ערוצים בפורמט JSON</label>
                <textarea id="custom-channels-json" rows="4" placeholder='[{"name":"ערוץ 1","url":"https://...","logo":"https://..."}]'></textarea>
            </div>
            <button onclick="addCustomChannelsFromJSON()" style="width:100%;padding:12px;border-radius:12px;background:rgba(255,255,255,0.1);color:#fff;font-weight:600;border:none;cursor:pointer;font-family:inherit;font-size:14px;">
                <i class="fas fa-file-import" style="margin-left:6px;"></i>ייבא ערוצים
            </button>
        </div>
        
        <div style="margin-bottom:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.1);">

// ============================================
// M3U Parser
// ============================================
function parseM3U(text, sourceId) {
    const lines = text.split(/\r?\n/);
    const channels = [];
    let info = null;
    for (let line of lines) {
        line = line.trim();
        if (!line) continue;
        if (line.startsWith('#EXTINF:')) {
            info = { sourceId };
            const attr = (key) => {
                const m = line.match(new RegExp(key + '="([^"]*)"', 'i'));
                return m ? m[1].trim() : '';
            };
            info.tvgId = attr('tvg-id');
            info.tvgName = attr('tvg-name');
            info.language = attr('tvg-language');
            info.logo = attr('tvg-logo');
            info.group = attr('group-title');
            info.name = extractExtinfName(line, info);
        } else if (!line.startsWith('#') && info) {
            info.url = line;
            channels.push(info);
            info = null;
        }
    }
    return channels;
}

/** חילוץ שם נקי מ־#EXTINF — בלי שאריות group-title / tvg-* */
function extractExtinfName(line, info) {
    let rest = line.replace(/^#EXTINF:-?\d+(?:\.\d+)?\s*/i, '');
    // מסיר את כל attributes מסוג key="value"
    rest = rest.replace(/[\w-]+="[^"]*"/g, ' ').trim();
    // מסיר פסיקים עודפים בתחילת/סוף
    rest = rest.replace(/^,+\s*|,+\s*$/g, '').trim();
    // אם נשאר זבל של attributes
    if (/group-title\s*=|tvg-/i.test(rest)) {
        const parts = rest.split(',');
        rest = (parts[parts.length - 1] || '').trim();
    }
    rest = rest.replace(/^["']+|["']+$/g, '').trim();
    if (rest && !/^[a-z0-9_-]+\s*=/i.test(rest)) return rest;
    return info.tvgName || info.group || 'Unknown';
}

// ============================================
// Classification & Helpers
// ============================================
function classifyChannel(ch) {
    const text = `${ch.name} ${ch.group || ''} ${ch.tvgName || ''}`;
    for (const rule of CATEGORY_RULES) {
        if (rule.patterns.some(p => p.test(text))) return rule.id;
    }
    return 'other';
}

function normLanguage(lang) {
    if (!lang) return 'und';
    const l = lang.toString().toLowerCase().trim();
    if (!l) return 'und';
    if (LANG_MAP[l]) return LANG_MAP[l];
    const short = l.slice(0,3);
    if (LANG_MAP[short]) return LANG_MAP[short];
    for (const key of Object.keys(LANG_MAP)) {
        if (l.indexOf(key) === 0 || key.indexOf(l) === 0) return LANG_MAP[key];
    }
    return 'und';
}

function catLabelHe(id) {
    const map = { sports:'ספורט', news:'חדשות', movies:'סרטים', kids:'ילדים', music:'מוזיקה', documentary:'דוקו', entertainment:'בידור', series:'סדרות', religious:'דת', adult:'18+', shop:'קניות', weather:'מזג אוויר', other:'אחר' };
    return map[id] || id;
}

function escapeHtml(text) {
    return String(text || '').replace(/[&<>"]+/g, (chunk) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' })[chunk] || chunk);
}

function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

function getSourceDef(sourceId) {
    return SOURCES.find(s => s.id === sourceId) || null;
}

/** מידע מקור לתצוגה + לינק למאגר הציבורי */
function getChannelSourceInfo(ch) {
    if (!ch) return { label: 'לא ידוע', href: IPTV_ORG_HOME, catalogUrl: IPTV_ORG_HOME };
    if (ch.sourceId === 'custom' || ch.sourceId === 'custom-m3u') {
        return {
            label: ch.sourceLabel || 'מותאם אישית',
            href: ch.url || IPTV_ORG_HOME,
            catalogUrl: ch.url || IPTV_ORG_HOME,
        };
    }
    const def = getSourceDef(ch.sourceId);
    const catalogUrl = ch.sourceCatalogUrl || def?.url || IPTV_ORG_HOME;
    const href = def?.repo || catalogUrl || IPTV_ORG_HOME;
    return {
        label: ch.sourceLabel || def?.label || ch.sourceId || 'iptv-org',
        href,
        catalogUrl,
    };
}

function enrichChannelSource(ch, src) {
    if (!ch || !src) return ch;
    ch.sourceId = src.id;
    ch.sourceLabel = src.label;
    ch.sourceCatalogUrl = src.url;
    ch.sourceRepoUrl = src.repo || src.url;
    return ch;
}

function shuffleArray(arr) {
    return arr.slice(); // לא מערבבים יותר — נשאר לתאימות
}

function loadHealthCache() {
    try {
        const raw = localStorage.getItem(HEALTH_CACHE_KEY);
        if (!raw) return false;
        const data = JSON.parse(raw);
        if (!data?.savedAt || Date.now() - data.savedAt > HEALTH_CACHE_TTL_MS) return false;
        if (!data.health || typeof data.health !== 'object') return false;
        healthData = data.health;
        return Object.keys(healthData).length > 0;
    } catch (e) {
        return false;
    }
}

function saveHealthCache() {
    try {
        localStorage.setItem(HEALTH_CACHE_KEY, JSON.stringify({
            savedAt: Date.now(),
            health: healthData,
        }));
    } catch (e) {
        console.warn('health cache save failed', e);
    }
}

function initSplashSources() {

    box.innerHTML = SOURCES.map(src => `
        <div class="splash-src-row" id="splash-src-${src.id}" data-id="${src.id}">
            <span class="splash-src-name">${escapeHtml(src.label)}</span>
            <span class="splash-src-status" id="splash-src-status-${src.id}">ממתין</span>
        </div>
    `).join('');
}

function setSplashSourceState(id, state, detail = '') {
    const row = document.getElementById(`splash-src-${id}`);
    const status = document.getElementById(`splash-src-status-${id}`);
    if (!row || !status) return;
    row.classList.remove('active', 'done', 'fail');
    if (state === 'scanning') {
        row.classList.add('active');
        status.textContent = 'סורק...';
        try { row.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) {}
    } else if (state === 'done') {
        row.classList.add('done');
        status.textContent = detail || 'מוכן';
    } else if (state === 'fail') {
        row.classList.add('fail');
        status.textContent = detail || 'נכשל';
    } else {
        status.textContent = detail || 'ממתין';
    }
}

// ============================================
// Channel Merging
// ============================================
function mergeChannels(newChannels) {
    const byUrl = new Map();
    allChannels.forEach(ch => { if (ch.url) byUrl.set(ch.url, ch); });
    newChannels.forEach(ch => {
        if (!ch || !ch.url) return;
        const key = ch.url.trim();
        const existing = byUrl.get(key);
        if (!existing) {
            byUrl.set(key, ch);
            return;
        }
        existing.name = existing.name || ch.name;
        existing.logo = existing.logo || ch.logo;
        existing.group = existing.group || ch.group;
        existing.language = existing.language || ch.language;
        existing.tvgId = existing.tvgId || ch.tvgId;
        existing.sourceId = existing.sourceId || ch.sourceId;
        existing.sourceLabel = existing.sourceLabel || ch.sourceLabel;
        existing.sourceCatalogUrl = existing.sourceCatalogUrl || ch.sourceCatalogUrl;
        existing.sourceRepoUrl = existing.sourceRepoUrl || ch.sourceRepoUrl;
    });
    allChannels = Array.from(byUrl.values());
    return allChannels;
}

// ============================================
// Fetch Sources — אחד אחרי השני (UX סריקה)
// ============================================
async function fetchAllSources() {
    initSplashSources();
    updateSplash('סורק מאגרי מידע ציבוריים...');
    let all = [];
    // לא שולפים rus אם רוסית כבויה בהגדרות
    const activeSources = SOURCES.filter(src => {
        if (src.id === 'rus' && !PREFERRED_LANG_CODES.has('ru')) return false;
        return true;
    });
    for (let i = 0; i < activeSources.length; i++) {
        const src = activeSources[i];
        setSplashSourceState(src.id, 'scanning');
        updateSplash(`פונה למאגר: ${src.label}`);
        updateScanBar(((i) / activeSources.length) * 40);
        const ctrl = new AbortController();
        const tid = setTimeout(() => ctrl.abort(), 15000);
        try {
            const res = await fetch(src.url, { signal: ctrl.signal });
            clearTimeout(tid);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const text = await res.text();
            const channels = parseM3U(text, src.id).map(ch => enrichChannelSource(ch, src));
            all = all.concat(channels);
            setSplashSourceState(src.id, 'done', `${channels.length} ערוצים`);
            updateSplash(`${src.label}: נמצאו ${channels.length} ערוצים`);
        } catch (e) {
            clearTimeout(tid);
            console.warn(`Failed ${src.id}:`, e.message);
            setSplashSourceState(src.id, 'fail', 'שגיאה');
            updateSplash(`${src.label}: לא זמין`);
        }
        updateScanBar(((i + 1) / activeSources.length) * 40);
        await sleep(320);
    }
    // מסמנים מאגרים שלא נסרקו (למשל rus כבוי)
    SOURCES.forEach(src => {
        if (!activeSources.includes(src)) setSplashSourceState(src.id, 'done', 'דולג');
    });
    updateSplash(`סה״כ ${all.length} רשומות מהמאגרים`);
    return all;
}

function loadCustomChannels() {
    try {
        const json = localStorage.getItem(CUSTOM_CHANNELS_KEY);
        if (!json) return [];
        const channels = JSON.parse(json);
        if (!Array.isArray(channels)) return [];
        return channels.map(ch => {
            if (ch?.name && /group-title\s*=|tvg-/i.test(ch.name)) {
                ch.name = extractExtinfName(`#EXTINF:-1 tvg-name="${ch.tvgName || ''}" group-title="${ch.group || ''}",${ch.name}`, ch);
            }
            return ch;
        });
    } catch (e) {
        console.warn('Failed to load custom channels', e);
        return [];
    }
}

function saveCustomChannels() {

                group: ch.group || 'custom',
                language: ch.language || 'und',
                tvgId: ch.tvgId || '',
                sourceId: 'custom',
                sourceLabel: 'מותאם אישית'

        saveCustomChannels();
        mergeChannels(customChannels);

        enqueueUnknownChannelsForScan();
        startHealthScan();
        
        jsonInput.value = '';
        showToast(`נוספו ${channels.length} ערוצים`);
    } catch (e) {
        console.error('JSON parse error:', e);
        showToast('שגיאה בפענוח JSON');
    }
}

function handleM3UFile(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const text = e.target.result;
            const channels = parseM3U(text, 'custom-m3u');
            
            channels.forEach(ch => {
                ch.sourceId = 'custom';
                ch.sourceLabel = 'קובץ מקומי';
                customChannels.push(ch);
            });
            
            saveCustomChannels();
            mergeChannels(customChannels);
            filterAndRank();
            renderSlides();
            enqueueUnknownChannelsForScan();
            startHealthScan();
            
            showToast(`נוספו ${channels.length} ערוצים מהקובץ`);
        } catch (e) {
            console.error('M3U parse error:', e);
            showToast('שגיאה בקריאת הקובץ');
        }
    };
    reader.readAsText(file);
    event.target.value = ''; // Reset input
}

// ============================================
// Filtering & Ranking
// ============================================
function enqueueUnknownChannelsForScan() {
    const pending = allChannels.filter(ch => {
        if (!ch || !ch.url) return false;
        if (!channelPassesContentFilter(ch)) return false;
        const h = healthData[ch.url];
        return !h || h.status === 'unknown';
    });
    const existing = new Set(scanQueue.map(ch => ch?.url));
    let toQueue = pending.filter(ch => !existing.has(ch.url));
    toQueue.sort((a, b) => channelPriorityScore(b) - channelPriorityScore(a));
    toQueue = toQueue.slice(0, MAX_HEALTH_SCAN());
    if (toQueue.length) {
        scanQueue.push(...toQueue);
        scanQueueTotal = scanQueue.length;
    }
    return toQueue.length;
}

function channelPriorityScore(ch) {
    let s = 0;
    if (ch.sourceId === 'il' || ch.sourceId === 'heb') s += 100;
    if (ch.sourceId === 'eng') s += 40;
    if (ch.sourceId === 'custom') s += 80;
    if (normLanguage(ch.language) === 'he') s += 50;
    if (normLanguage(ch.language) === 'en') s += 25;
    if (HE_IL_NAME_RE.test(`${ch.name} ${ch.group || ''}`)) s += 35;
    return s;
}

/** שפה אפקטיבית: תג + מקור + שם (לא סומכים רק על tvg-language) */
function detectEffectiveLang(ch) {
    const raw = (ch.language || '').toString().toLowerCase();
    const text = `${ch.name || ''} ${ch.group || ''} ${ch.tvgName || ''}`;
    const mapped = normLanguage(ch.language);

    if (ch.sourceId === 'rus' || mapped === 'ru' || raw.includes('russian') || raw.includes('рус')) return 'ru';
    if (CYRILLIC_RE.test(text) || RUSSIAN_NAME_RE.test(text)) return 'ru';

    if (ch.sourceId === 'heb' || mapped === 'he' || raw.includes('hebrew') || /עברית/.test(text)) return 'he';
    if (ch.sourceId === 'il' && (mapped === 'he' || mapped === 'und' || !ch.language)) return 'he';

    if (mapped === 'ar' || ARABIC_SCRIPT_RE.test(text) || ARABIC_PATTERNS.some(p => p.test(text))) return 'ar';

    if (ch.sourceId === 'eng' || mapped === 'en' || raw.startsWith('en') || raw.includes('english')) return 'en';

    if (mapped && mapped !== 'und') return mapped;
    if (ch.sourceId === 'il' || ch.sourceId === 'heb' || ch.sourceId === 'custom') return 'und';
    return mapped || 'und';
}

function channelPassesContentFilter(ch) {
    const text = `${ch.name || ''} ${ch.group || ''} ${ch.tvgName || ''}`;
    if (SOUTH_AFRICA_PATTERNS.some(p => p.test(text))) return false;

    const effective = detectEffectiveLang(ch);
    ch.langCode = effective;
    ch.effectiveLang = effective;

    // רוסית — רק אם הטוגל רוסית דלוק
    if (effective === 'ru') return PREFERRED_LANG_CODES.has('ru');
    // ערבית — תמיד לא (אלא אם יום אחד יתווסף טוגל)
    if (effective === 'ar') return PREFERRED_LANG_CODES.has('ar');

    // רק שפות שסומנו בהגדרות
    if (PREFERRED_LANG_CODES.has(effective) || ALLOWED_LANG_CODES.has(effective)) return true;

    // und רק ממקורות ישראל/עברית/מותאם — לא מ־news/sports העולמיים
    if (effective === 'und' || effective === '') {
        return ch.sourceId === 'il' || ch.sourceId === 'heb' || ch.sourceId === 'custom';
    }

    return false;
}

function filterAndRank(opts = {}) {
    const rebuild = opts.rebuild === true;
    const seen = new Set();
    const unique = [];
    for (const ch of allChannels) {
        if (!ch.url || seen.has(ch.url)) continue;
        seen.add(ch.url);
        ch.category = classifyChannel(ch);
        if (!channelPassesContentFilter(ch)) continue;
        if (blockedCats.has(ch.category)) continue;
        unique.push(ch);
    }

    const byUrl = new Map(unique.map(ch => [ch.url, ch]));
    const fastOnes = unique.filter(ch => healthData[ch.url]?.status === 'fast');

    const stableSort = (arr) => {
        arr.sort((a, b) => {
            const fa = userFavorites.has(a.name) ? 1 : 0;
            const fb = userFavorites.has(b.name) ? 1 : 0;
            if (fa !== fb) return fb - fa;
            const pa = channelPriorityScore(a);
            const pb = channelPriorityScore(b);
            if (pa !== pb) return pb - pa;
            return String(a.name || '').localeCompare(String(b.name || ''), 'he');
        });
        return arr;
    };

    // קטגוריה/מועדפים — לא נוגעים ב־pinned של "הכל"
    if (activeCat === 'favorites') {
        filteredChannels = stableSort(fastOnes.filter(ch => userFavorites.has(ch.name))).slice(0, 100);
        return;
    }
    if (activeCat !== 'all') {
        filteredChannels = stableSort(fastOnes.filter(ch => ch.category === activeCat)).slice(0, 100);
        return;
    }

    // "הכל": מה שהופיע נשאר לנצח בסשן — רק מוסיפים. rebuild רק בשינוי שפה/חסימה/סריקה מחדש
    if (rebuild || !pinnedFeedChannels.length) {
        pinnedFeedChannels = stableSort(fastOnes.slice()).slice(0, 100);
        filteredChannels = pinnedFeedChannels.slice();
        return;
    }

    pinnedFeedChannels = pinnedFeedChannels.map(ch => byUrl.get(ch.url) || ch);
    const pinnedUrls = new Set(pinnedFeedChannels.map(ch => ch.url));
    const newcomers = stableSort(fastOnes.filter(ch => !pinnedUrls.has(ch.url)));
    pinnedFeedChannels = [...pinnedFeedChannels, ...newcomers].slice(0, 100);
    filteredChannels = pinnedFeedChannels.slice();
}

// ============================================
// Rendering
// ============================================
function cleanupVideoState() {
    Object.values(hlsPool).forEach(hls => { try { hls.destroy(); } catch (e) {} });
    hlsPool = {};
    loadedSlides.clear();
    currentSlideIndex = -1;
    if (scrollObserver) { scrollObserver.disconnect(); scrollObserver = null; }
    Object.values(overlayTimers).forEach(timer => clearTimeout(timer));
    overlayTimers = {};
}

function buildCatBar() {
    const bar = document.getElementById('cat-bar');
    const cats = [
        { id:'all', label:'הכל', icon:'fa-globe' },
        { id:'favorites', label:'מועדפים', icon:'fa-star' },
        ...CATEGORY_RULES.filter(r => r.id !== 'adult' && r.id !== 'religious').map(r => ({ id:r.id, label:catLabelHe(r.id), icon:r.icon }))
    ];
    bar.innerHTML = cats.map(c => `<div class="cat-pill ${c.id === activeCat ? 'active' : ''}" onclick="selectCategory('${c.id}')"><i class="fas ${c.icon}" style="margin-left:4px;font-size:11px;"></i>${c.label}</div>`).join('');
}

function selectCategory(catId) {
    activeCat = catId;
    filterAndRank(); // קטגוריה אחרת לא מוחקת pinned של "הכל"
    renderSlides(true);
    buildCatBar();
    document.getElementById('scroller').scrollTo({ top:0, behavior:'auto' });
    showToast(`${catId === 'all' ? 'כל הערוצים' : catId === 'favorites' ? 'מועדפים' : catLabelHe(catId)} — ${filteredChannels.length}`);
}

/** רינדור מלא — רק בפתיחה / החלפת קטגוריה */
function renderSlides(forceRestart = true) {
    cleanupVideoState();
    const scroller = document.getElementById('scroller');
    if (!filteredChannels.length) {
        scroller.innerHTML = `<div class="empty-state">
            <i class="fas fa-satellite-dish"></i>
            <span>${healthScanActive ? 'מחפש ערוצים שעובדים…' : 'לא נמצאו ערוצים זמינים'}</span>
        </div>`;
        return;
    }
    scroller.innerHTML = filteredChannels.map((ch, idx) => renderSlideHTML(ch, idx)).join('');
    setupScrollObserver();
    setTimeout(() => onSlideVisible(0), 80);
}

/** רק מוסיף ערוצים חדשים — אף פעם לא מוחק / מרנדר מחדש באמצע צפייה */
function softUpdateFeed() {
    const scroller = document.getElementById('scroller');
    if (!scroller) return;
    const prevLen = scroller.querySelectorAll('.slide').length;

    filterAndRank(); // append-only ל־pinned

    if (!filteredChannels.length) {
        if (!prevLen) renderSlides(true);
        return;
    }

    if (!prevLen) {
        document.getElementById('splash')?.classList.add('hide');
        renderSlides(true);
        feedBootstrapped = true;
        quietScanToasts = true;
        showToast(`${filteredChannels.length} ערוצים מוכנים`);
        return;
    }

    // הוספה בסוף בלבד
    if (filteredChannels.length > prevLen) {
        for (let i = prevLen; i < filteredChannels.length; i++) {
            // ודא שה־URL לא כבר קיים ב־DOM
            const url = filteredChannels[i].url;
            const exists = Array.from(scroller.querySelectorAll('.slide')).some(
                el => decodeURIComponent(el.dataset.url || '') === url
            );
            if (exists) continue;
            scroller.insertAdjacentHTML('beforeend', renderSlideHTML(filteredChannels[i], i));
        }
        // תיקון data-index לכל הסליידים
        Array.from(scroller.querySelectorAll('.slide')).forEach((el, i) => {
            el.dataset.index = String(i);
        });
        setupScrollObserver();
        const tot = document.getElementById('header-channel-total');
        if (tot) tot.textContent = String(scroller.querySelectorAll('.slide').length);
        preloadSlide(currentSlideIndex + 1);
        preloadSlide(currentSlideIndex + 2);
    }
    // אם יש פחות — מתעלמים (לא מוחקים מהמסך באמצע סשן)
}

function renderSlideHTML(ch, idx) {
    const health = healthData[ch.url] || { status:'unknown', ms:0 };
    const healthClass = `health-${health.status}`;
    const healthLabel = health.status === 'fast' ? 'פעיל' : health.status === 'slow' ? 'איטי' : health.status === 'dead' ? 'לא זמין' : 'בבדיקה';
    const volIcon = channelMuteState[ch.url] ? 'fas fa-volume-xmark' : 'fas fa-volume-high';
    const catLabel = catLabelHe(ch.category);
    const catRule = CATEGORY_RULES.find(r => r.id === ch.category);
    const catIcon = catRule ? catRule.icon : 'fa-circle';
    return `
    <div class="slide" data-index="${idx}" data-url="${encodeURIComponent(ch.url)}">
        <div class="slide-bg" style="background-image:url('${ch.logo || ''}')"></div>
        <div class="video-loader" id="loader-${idx}"><div class="video-spinner"></div></div>
        <video id="video-${idx}" playsinline webkit-playsinline muted loop preload="metadata" style="position:absolute;inset:0;z-index:2;"></video>
        <div class="overlay-top" id="overlay-top-${idx}">
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                <span class="health-badge ${healthClass}"><span class="health-dot"></span>${healthLabel}</span>
                <span style="font-size:10px;color:#888;background:rgba(255,255,255,0.08);padding:1px 6px;border-radius:6px;"><i class="fas ${catIcon}" style="margin-left:3px;font-size:9px;"></i>${catLabel}</span>
            </div>
        </div>
        <div class="side-actions" id="side-${idx}">
            <div style="text-align:center;"><button class="side-btn" onclick="toggleChannelAudio(${idx})" aria-label="שמע"><i class="${volIcon}" id="vol-icon-${idx}"></i></button><div class="side-btn-label">שמע</div></div>
            <div style="text-align:center;"><button class="side-btn" onclick="toggleFavorite(${idx})" aria-label="מועדף"><i class="${userFavorites.has(ch.name) ? 'fas fa-star' : 'far fa-star'}"></i></button><div class="side-btn-label">מועדף</div></div>
            <div style="text-align:center;"><button class="side-btn" onclick="blockChannel(${idx})" aria-label="חסום"><i class="fas fa-ban"></i></button><div class="side-btn-label">חסום</div></div>
        </div>
    </div>`;
}

// ============================================
// Scroll Observer
// ============================================
function setupScrollObserver() {
    const scroller = document.getElementById('scroller');
    if (!scroller) return;
    const slides = Array.from(document.querySelectorAll('.slide'));
    if (!slides.length) return;
    if (scrollObserver) { scrollObserver.disconnect(); scrollObserver = null; }
    const updateFromScroll = () => {
        const viewportHeight = window.innerHeight || document.documentElement.clientHeight || 1;
        const top = scroller.scrollTop + (viewportHeight / 2);
        let nearestIndex = 0;
        let nearestDistance = Infinity;
        slides.forEach((slide, index) => {
            const slideTop = slide.offsetTop;
            const distance = Math.abs(slideTop - top);
            if (distance < nearestDistance) {
                nearestDistance = distance;
                nearestIndex = index;
            }
        });
        if (nearestIndex !== currentSlideIndex) onSlideVisible(nearestIndex);
    };
    if (handleScrollerScroll) scroller.removeEventListener('scroll', handleScrollerScroll);
    handleScrollerScroll = () => {
        if (scrollRaf) cancelAnimationFrame(scrollRaf);
        scrollRaf = requestAnimationFrame(updateFromScroll);
    };
    scroller.addEventListener('scroll', handleScrollerScroll, { passive:true });
    updateFromScroll();
}

function onSlideVisible(idx) {
    if (idx === currentSlideIndex) return;
    pauseSlide(currentSlideIndex);
    currentSlideIndex = idx;
    loadSlideVideo(idx);
    preloadSlide(idx + 1);
    preloadSlide(idx + 2);
    updateHeaderPanel(idx);
    if (autoScrollEnabled) resetAutoScrollCountdown();
}

// ============================================
// Video Loading
// ============================================
function loadSlideVideo(idx) {
    if (!filteredChannels[idx]) return;
    const ch = filteredChannels[idx];
    const video = document.getElementById(`video-${idx}`);
    const loader = document.getElementById(`loader-${idx}`);
    const slideBg = document.querySelector(`.slide[data-index="${idx}"] .slide-bg`);
    if (!video) return;
    const muted = channelMuteState[ch.url] === true;
    
    if (loadedSlides.has(idx)) {
        if (loader) loader.style.display = 'none';
        video.muted = muted;
        video.style.opacity = '1';
        video.style.zIndex = '3';
        if (slideBg) slideBg.style.opacity = '0.3';
        const icon = document.getElementById(`vol-icon-${idx}`);
        if (icon) icon.className = muted ? 'fas fa-volume-xmark' : 'fas fa-volume-high';
        if (idx === currentSlideIndex && video.paused) {
            video.play().catch(e => {
                video.muted = true;
                video.play().catch(() => {});
            });
        }
        return;
    }
    
    loadedSlides.add(idx);
    const start = Date.now();
    let settled = false;
    
    const markReady = () => {
        if (settled) return;
        settled = true;
        const ms = Date.now() - start;
        const prev = healthData[ch.url];
        // לא מורידים מ־fast ל־slow אחרי שכבר הוצג
        if (prev?.status === 'fast') {
            healthData[ch.url] = { status: 'fast', ms: Math.min(prev.ms || ms, ms), lastCheck: Date.now() };
        } else {
            healthData[ch.url] = { status: ms <= FAST_MS_THRESHOLD ? 'fast' : 'slow', ms, lastCheck: Date.now() };
        }
        if (loader) loader.style.display = 'none';
        video.style.opacity = '1';
        video.style.zIndex = '3';
        video.style.display = '';
        if (slideBg) slideBg.style.opacity = '0.3';
        if (idx === currentSlideIndex) {
            video.play().catch(e => {
                video.muted = true;
                video.play().catch(() => {});
            });
        }
    };
    
    const markError = () => {
        if (settled) return;
        settled = true;
        // לא מוחקים ערוץ שכבר הוכתר כ־fast — רק מדלגים לנגן
        const prev = healthData[ch.url];
        if (prev?.status !== 'fast') {
            healthData[ch.url] = { status:'dead', ms:99999, lastCheck: Date.now() };
        }
        if (loader) loader.innerHTML = `<div class="empty-state" style="height:auto;min-height:0;"><i class="fas fa-exclamation-triangle"></i><span>מדלג…</span></div>`;
        video.style.display = 'none';
        if (slideBg) slideBg.style.opacity = '1';
        if (idx === currentSlideIndex) {
            setTimeout(() => skipFailedChannel(idx), 350);
        }
    };
    
    video.style.opacity = '0';
    video.style.transition = 'opacity .5s ease';
    video.style.zIndex = '3';
    video.muted = muted;
    video.playsInline = true;
    video.autoplay = true;
    video.loop = true;
    
    if (Hls.isSupported() && ch.url.includes('.m3u8')) {
        const hls = new Hls({ 
            maxBufferLength: isMobileMode() ? 6 : 10, 
            liveSyncDurationCount: 2, 
            enableWorker: !isMobileMode(), 
            lowLatencyMode: !isMobileMode(),
            startLevel: -1
        });
        hls.loadSource(ch.url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
            video.addEventListener('loadeddata', markReady, { once: true });
            video.addEventListener('canplay', markReady, { once: true });
            setTimeout(() => {
                if (!settled && video.readyState >= 2) markReady();
            }, isMobileMode() ? 5000 : 3000);
        });
        hls.on(Hls.Events.ERROR, (event, data) => { 
            if (data.fatal) markError(); 
        });
        hlsPool[idx] = hls;
        setTimeout(() => { if (!settled) markError(); }, HEALTH_CHECK_TIMEOUT_MS());
    } else {
        video.src = ch.url;
        video.addEventListener('loadeddata', markReady, { once:true });
        video.addEventListener('canplay', markReady, { once:true });
        video.addEventListener('error', markError, { once:true });
        setTimeout(() => { if (!settled) markError(); }, HEALTH_CHECK_TIMEOUT_MS());
    }
}

function preloadSlide(idx) {
    if (idx < 0 || idx >= filteredChannels.length) return;
    if (!loadedSlides.has(idx)) loadSlideVideo(idx);
    const video = document.getElementById(`video-${idx}`);
    if (video && idx !== currentSlideIndex) video.pause();
}

function pauseSlide(idx) {
    const video = document.getElementById(`video-${idx}`);
    if (video) video.pause();
    const dist = Math.abs(idx - currentSlideIndex);
    // שומרים preload של ±2
    if (hlsPool[idx] && dist > 2) {
        try { hlsPool[idx].destroy(); } catch (e) {}
        delete hlsPool[idx];
        loadedSlides.delete(idx);
    }
}

/** דילוג לנגן בלבד — בלי למחוק ערוצים מהפיד */
function skipFailedChannel(failedIdx) {
    if (!filteredChannels.length) return;
    const next = Math.min(failedIdx + 1, filteredChannels.length - 1);
    if (next !== failedIdx) scrollToSlide(next);
}

// ============================================
// Channel Actions
// ============================================
function toggleChannelAudio(idx) {
    const ch = filteredChannels[idx];
    const video = document.getElementById(`video-${idx}`);
    const icon = document.getElementById(`vol-icon-${idx}`);
    if (!video || !ch) return;
    video.muted = !video.muted;
    channelMuteState[ch.url] = video.muted;
    if (icon) icon.className = video.muted ? 'fas fa-volume-xmark' : 'fas fa-volume-high';
    if (idx === currentSlideIndex && !video.muted && video.paused) {
        video.play().catch(() => showToast('שמע נכשל - משתהה'));
    }
    showToast(video.muted ? 'מושתק' : 'שמע פעיל');
}

function toggleFavorite(idx) {
    const ch = filteredChannels[idx];
    if (!ch) return;
    if (userFavorites.has(ch.name)) {
        userFavorites.delete(ch.name);
        showToast(`${ch.name} הוסר מהמועדפים`);
    } else {
        userFavorites.add(ch.name);
        showToast(`${ch.name} נוסף למועדפים`);
    }
    saveUserData();
}

function blockChannel(idx) {
    const ch = filteredChannels[idx];
    if (!ch) return;
    blockedCats.add(ch.category);
    saveUserData();
    showToast(`${ch.name} נחסם`);
    filterAndRank();
    renderSlides();
}

// ============================================
// Auto Scroll
// ============================================
function toggleAutoScroll() {
    autoScrollEnabled = !autoScrollEnabled;
    updateAutoScrollButton();
    updateCountdown();
    if (autoScrollEnabled) startAutoScroll();
    else stopAutoScroll();
}

function startAutoScroll() {
    stopAutoScroll();
    autoScrollEnabled = true;
    autoScrollTick = 10;
    updateCountdown();
    autoScrollInterval = setInterval(() => {
        autoScrollTick -= 1;
        if (autoScrollTick <= 0) {
            const next = currentSlideIndex + 1 >= filteredChannels.length ? 0 : currentSlideIndex + 1;
            scrollToSlide(next);
            autoScrollTick = 10;
        }
        updateCountdown();
    }, 1000);
}

function resetAutoScrollCountdown() {
    autoScrollTick = 10;
    updateCountdown();
}

function stopAutoScroll() {
    autoScrollEnabled = false;
    clearInterval(autoScrollInterval);
    autoScrollInterval = null;
    autoScrollTick = 10;
    updateCountdown();
    updateAutoScrollButton();
}

function updateAutoScrollButton() {
    const btn = document.getElementById('auto-scroll-btn');
    if (!btn) return;
    btn.textContent = autoScrollEnabled ? 'עצור' : 'אוטו';
    btn.classList.toggle('active', autoScrollEnabled);
}

function updateCountdown() {
    const countdown = document.getElementById('auto-countdown');
    if (!countdown) return;
    countdown.textContent = autoScrollEnabled ? `${autoScrollTick}s` : 'כבוי';
}

function scrollToSlide(idx) {
    const slide = document.querySelector(`.slide[data-index="${idx}"]`);
    if (slide) slide.scrollIntoView({ behavior:'smooth' });
}

// ============================================
// Health Scan
// ============================================
function startHealthScan() {
    if (healthScanActive) return;
    healthScanActive = true;
    scanQueue = [];
    const n = enqueueUnknownChannelsForScan();
    scanQueueTotal = scanQueue.length || 1;
    if (!quietScanToasts && !feedBootstrapped) updateScanBar(10);
    softUpdateFeed();
    if (!n) {
        healthScanActive = false;
        document.getElementById('scan-progress').classList.remove('show');
        return;
    }
    if (IS_FILE_ORIGIN && !quietScanToasts) {
        showToast('אזהרה: file:// חוסם רוב הסטרימים', 3500);
    }
    // בלי טוסטים על סריקת רקע — רק ערוצים עולים למסך
    processHealthQueue();
}

async function processHealthQueue() {
    if (!scanQueue.length) {
        healthScanActive = false;
        document.getElementById('scan-progress').classList.remove('show');
        softUpdateFeed();
        saveHealthCache();
        return;
    }
    const batch = scanQueue.splice(0, HEALTH_BATCH_SIZE());
    await Promise.all(batch.map(ch => quickHealthCheck(ch)));
    const completed = scanQueueTotal - scanQueue.length;
    if (!quietScanToasts && !feedBootstrapped) {
        updateScanBar(10 + (completed / Math.max(scanQueueTotal, 1)) * 80);
    } else {
        document.getElementById('scan-progress')?.classList.remove('show');
    }

    softUpdateFeed();
    if (completed % 20 === 0) saveHealthCache();

    updateHeaderPanel(Math.max(0, currentSlideIndex));
    setTimeout(() => processHealthQueue(), HEALTH_BATCH_DELAY_MS());
}

async function quickHealthCheck(ch) {
    if (!ch || !ch.url) return;
    const existing = healthData[ch.url];
    // ערוץ שכבר עובד — לא בודקים שוב ולא מורידים ל־dead
    if (existing?.status === 'fast') return;
    if (existing && existing.status !== 'unknown' && Date.now() - existing.lastCheck < 5 * 60 * 1000) return;
    return new Promise((resolve) => {
        let settled = false;
        const video = document.createElement('video');
        video.muted = true;
        video.playsInline = true;
        video.setAttribute('playsinline', '');
        video.setAttribute('webkit-playsinline', '');
        video.preload = 'auto';
        let hls = null;
        const cleanup = () => {
            try { if (hls) hls.destroy(); } catch (e) {}
            try { video.removeAttribute('src'); video.load(); } catch (e) {}
            try { video.remove(); } catch (e) {}
        };
        const finish = (status, ms = 99999) => {
            if (settled) return;
            settled = true;
            const prev = healthData[ch.url];
            if (prev?.status === 'fast') {
                // נעילה: לא מורידים מ־fast
                healthData[ch.url] = { status: 'fast', ms: prev.ms || ms, lastCheck: Date.now() };
            } else {
                healthData[ch.url] = { status, ms, lastCheck: Date.now() };
            }
            cleanup();
            resolve();
        };
        const startTime = Date.now();
        const useHls = window.Hls && Hls.isSupported() && /\.m3u8($|\?)/i.test(ch.url);
        if (useHls) {
            hls = new Hls({
                maxBufferLength: 2,
                liveSyncDurationCount: 1,
                enableWorker: false,
                lowLatencyMode: false,
                manifestLoadingTimeOut: 8000,
                levelLoadingTimeOut: 8000,
            });
            hls.loadSource(ch.url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                const ms = Date.now() - startTime;
                finish(ms <= FAST_MS_THRESHOLD ? 'fast' : 'slow', ms);
            });
            hls.on(Hls.Events.ERROR, (_e, data) => {
                if (data?.fatal || data?.type === 'networkError') finish('dead');
            });
            setTimeout(() => finish('dead'), HEALTH_CHECK_TIMEOUT_MS());
        } else {
            video.src = ch.url;
            const onReady = () => finish(Date.now() - startTime <= FAST_MS_THRESHOLD ? 'fast' : 'slow', Date.now() - startTime);
            video.addEventListener('loadeddata', onReady, { once: true });
            video.addEventListener('canplay', onReady, { once: true });
            video.addEventListener('error', () => finish('dead'), { once: true });
            setTimeout(() => finish('dead'), HEALTH_CHECK_TIMEOUT_MS());
        }
    });
}

function updateHeaderPanel(idx) {
    const ch = filteredChannels[idx];
    if (!ch) return;
    document.getElementById('header-channel-number').textContent = idx + 1;
    document.getElementById('header-channel-total').textContent = filteredChannels.length;
    const status = healthData[ch.url]?.status;
    const statusLabel = status === 'fast' ? 'פעיל' : status === 'slow' ? 'איטי' : status === 'dead' ? 'לא זמין' : 'בבדיקה';
    const chipName = document.getElementById('channel-chip-name');
    const chipMeta = document.getElementById('channel-chip-meta');
    const chipEpg = document.getElementById('channel-chip-epg');
    const chipSource = document.getElementById('channel-chip-source');
    const chipSourceLabel = document.getElementById('channel-chip-source-label');
    const src = getChannelSourceInfo(ch);
    const langLabel = ch.effectiveLang === 'he' ? 'עברית' : ch.effectiveLang === 'en' ? 'אנגלית' : ch.effectiveLang === 'ru' ? 'רוסית' : (ch.effectiveLang || '');
    if (chipName) chipName.textContent = ch.name || 'ערוץ לא ידוע';
    if (chipMeta) {
        chipMeta.innerHTML = `
            <span class="health-badge health-${status || 'unknown'}"><span class="health-dot"></span>${statusLabel}</span>
            <span class="chip-live"><i class="fas fa-broadcast-tower"></i>שידור חי</span>
            <span>${catLabelHe(ch.category)}</span>
            ${langLabel ? `<span>${langLabel}</span>` : ''}
        `;
    }
    const nowProg = getNowAndNext(ch.tvgId).now;
    if (chipEpg) {
        if (nowProg) {
            chipEpg.classList.add('show');
            chipEpg.innerHTML = `<span class="epg-now-label">עכשיו</span>${escapeHtml(nowProg.title)}`;
        } else {
            chipEpg.classList.remove('show');
            chipEpg.innerHTML = '';
        }
    }
    if (chipSource && chipSourceLabel) {
        chipSource.href = src.href;
        chipSource.title = src.catalogUrl || src.href;
        chipSource.style.display = 'inline-flex';
        chipSourceLabel.textContent = `מקור: ${src.label} · iptv-org`;
    }
    updateEpgFab(ch);
}

// ============================================
// EPG (לוח שידורים)
// ============================================
function parseXmltvDate(str) {
    if (!str) return null;
    const m = String(str).match(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})/);
    if (!m) return null;
    return new Date(Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6]));
}

function ingestXmltv(xmlText) {
    const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
    if (doc.querySelector('parsererror')) return 0;
    let count = 0;
    doc.querySelectorAll('programme').forEach(p => {
        const channel = p.getAttribute('channel');
        if (!channel) return;
        const start = parseXmltvDate(p.getAttribute('start'));
        const stop = parseXmltvDate(p.getAttribute('stop'));
        const title = p.querySelector('title')?.textContent?.trim() || 'תוכנית';
        const desc = p.querySelector('desc')?.textContent?.trim() || '';
        if (!start || !stop) return;
        if (!epgData[channel]) epgData[channel] = [];
        epgData[channel].push({ start, stop, title, desc });
        count++;
    });
    Object.keys(epgData).forEach(id => {
        epgData[id].sort((a, b) => a.start - b.start);
    });
    return count;
}

async function fetchEpgSources() {
    updateSplash('טוען לוח שידורים...');
    let total = 0;
    await Promise.allSettled(EPG_SOURCES.map(async (url) => {
        try {
            const ctrl = new AbortController();
            const tid = setTimeout(() => ctrl.abort(), 20000);
            const res = await fetch(url, { signal: ctrl.signal });
            clearTimeout(tid);
            if (!res.ok) return;
            const text = await res.text();
            total += ingestXmltv(text);
        } catch (e) {
            console.warn('EPG failed', url, e.message);
        }
    }));
    return total;
}

function getNowAndNext(tvgId) {
    if (!tvgId || !epgData[tvgId]?.length) return { now: null, next: null, list: [] };
    const now = Date.now();
    const list = epgData[tvgId];
    let current = null;
    let next = null;
    for (let i = 0; i < list.length; i++) {
        const p = list[i];
        if (p.start.getTime() <= now && p.stop.getTime() > now) {
            current = p;
            next = list[i + 1] || null;
            break;
        }
        if (p.start.getTime() > now) {
            next = p;
            break;
        }
    }
    const upcoming = list.filter(p => p.stop.getTime() > now).slice(0, 12);
    return { now: current, next, list: upcoming };
}

function channelHasEpg(ch) {
    if (!ch?.tvgId) return false;
    return !!(epgData[ch.tvgId]?.length);
}

function updateEpgFab(ch) {
    const fab = document.getElementById('epg-fab');
    if (!fab) return;
    if (channelHasEpg(ch)) fab.classList.add('show');
    else fab.classList.remove('show');
}

function formatEpgTime(d) {
    if (!d) return '';
    return d.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
}

function openEpgSheet() {
    const ch = filteredChannels[currentSlideIndex];
    if (!ch || !channelHasEpg(ch)) {
        showToast('אין לוח שידורים לערוץ זה');
        return;
    }
    const { now, list } = getNowAndNext(ch.tvgId);
    document.getElementById('epg-modal-channel').textContent = ch.name;
    const listEl = document.getElementById('epg-modal-list');
    if (!list.length) {
        listEl.innerHTML = `<div style="color:#888;font-size:13px;">אין תוכניות זמינות כרגע</div>`;
    } else {
        listEl.innerHTML = list.map(p => {
            const isNow = now && p.start.getTime() === now.start.getTime();
            return `<div style="padding:12px;border-radius:12px;background:${isNow ? 'rgba(245,158,11,0.15)' : 'rgba(255,255,255,0.05)'};border:1px solid ${isNow ? 'rgba(245,158,11,0.4)' : 'rgba(255,255,255,0.06)'};">
                <div style="display:flex;justify-content:space-between;gap:8px;margin-bottom:4px;">
                    <span style="font-size:11px;color:var(--accent);font-weight:700;">${formatEpgTime(p.start)} – ${formatEpgTime(p.stop)}</span>
                    ${isNow ? '<span style="font-size:10px;color:#000;background:var(--accent);padding:2px 8px;border-radius:8px;font-weight:700;">עכשיו</span>' : ''}
                </div>
                <div style="font-size:14px;font-weight:600;">${escapeHtml(p.title)}</div>
                ${p.desc ? `<div style="font-size:12px;color:#888;margin-top:4px;line-height:1.4;">${escapeHtml(p.desc.slice(0, 160))}</div>` : ''}
            </div>`;
        }).join('');
    }
    document.getElementById('epg-modal').classList.remove('hide');
}

function closeEpgSheet() {
    document.getElementById('epg-modal').classList.add('hide');
}

function updateSplash(text) {
    const el = document.getElementById('splash-status');
    if (el) el.textContent = text;
}

function updateScanBar(pct) {
    if (quietScanToasts || feedBootstrapped) {
        document.getElementById('scan-progress')?.classList.remove('show');
        return;
    }
    const bar = document.getElementById('scan-bar');
    if (bar) bar.style.width = `${Math.min(100, Math.max(0, pct))}%`;
    document.getElementById('scan-progress').classList.add('show');
}

let toastTimer = null;
function showToast(msg, duration = 2500) {
    // אחרי שהפיד עלה — לא מציפים בהודעות סריקה
    if (quietScanToasts && /סריק|מועמדים|ברקע|מהזיכרון|הושלמה/.test(msg)) return;
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), duration);
}

function toggleSettings() {
    document.getElementById('settings-modal').classList.toggle('hide');
}

function buildSettingsModal() {
    const blockList = document.getElementById('block-list');
    // כתום = קטגוריה מוצגת (לא חסומה)
    blockList.innerHTML = CATEGORY_RULES.filter(c => c.id !== 'adult').map(c => {
        const isShown = !blockedCats.has(c.id);
        return `<div class="block-toggle"><span style="font-size:13px;">${catLabelHe(c.id)}</span><div class="toggle-switch ${isShown ? 'on' : ''}" onclick="toggleBlockedCat('${c.id}', this)" role="switch" aria-checked="${isShown}"></div></div>`;
    }).join('');
    
    const langList = document.getElementById('lang-list');
    const langs = [{ code:'en', label:'אנגלית' }, { code:'he', label:'עברית' }, { code:'ru', label:'רוסית' }];
    langList.innerHTML = langs.map(l => {
        const isActive = PREFERRED_LANG_CODES.has(l.code);
        const fastCount = allChannels.filter(ch => normLanguage(ch.language) === l.code && healthData[ch.url]?.status === 'fast').length;
        return `<div class="block-toggle">
            <span style="font-size:13px;">${l.label} <span style="color:#888;font-size:11px;">(${fastCount} מהירים)</span></span>
            <div class="toggle-switch ${isActive ? 'on' : ''}" onclick="toggleLang('${l.code}', this)" role="switch" aria-checked="${isActive}"></div>
        </div>`;
    }).join('');
}

function toggleBlockedCat(catId, el) {
    // כתום = מוצג. לחיצה על כתום → חוסם; על אפור → מציג
    if (blockedCats.has(catId)) {
        blockedCats.delete(catId);
        el.classList.add('on');
        el.setAttribute('aria-checked', 'true');
    } else {
        blockedCats.add(catId);
        el.classList.remove('on');
        el.setAttribute('aria-checked', 'false');
    }
    saveUserData();
    filterAndRank({ rebuild: true });
    renderSlides();
    const fastCount = filteredChannels.filter(ch => healthData[ch.url]?.status === 'fast').length;
    showToast(`${catLabelHe(catId)} ${blockedCats.has(catId) ? 'הוסתרה' : 'מוצגת'} — ${fastCount} ערוצים מהירים`);
}

function toggleLang(code, el) {
    if (PREFERRED_LANG_CODES.has(code)) {
        if (PREFERRED_LANG_CODES.size <= 1) return;
        PREFERRED_LANG_CODES.delete(code);
        el.classList.remove('on');
    } else {
        PREFERRED_LANG_CODES.add(code);
        el.classList.add('on');
    }
    ALLOWED_LANG_CODES.clear();
    PREFERRED_LANG_CODES.forEach(c => ALLOWED_LANG_CODES.add(c));
    saveUserData();
    filterAndRank({ rebuild: true });
    renderSlides();
    const fastCount = filteredChannels.length;
    const langName = code === 'en' ? 'אנגלית' : code === 'he' ? 'עברית' : code === 'ru' ? 'רוסית' : code;
    showToast(`${langName} ${PREFERRED_LANG_CODES.has(code) ? 'הופעלה' : 'נוטרלה'} — ${fastCount} ערוצים`);
}

function rescanChannels() {
    toggleSettings();
    cleanupVideoState();
    healthData = {};
    pinnedFeedChannels = [];
    feedBootstrapped = false;
    quietScanToasts = false;
    try { localStorage.removeItem(HEALTH_CACHE_KEY); } catch (e) {}
    isScanning = false;
    scanQueue = [];
    healthScanActive = false;
    init();
}

function showTopControls() {
    document.getElementById('top-header').classList.remove('hidden');
    scheduleTopControlsHide();
}

function hideTopControls() {
    document.getElementById('top-header').classList.add('hidden');
}

function scheduleTopControlsHide() {
    clearTimeout(topControlsHideTimer);
    topControlsHideTimer = setTimeout(hideTopControls, 5000);
}

// ============================================
// Data Persistence
// ============================================
function saveUserData() {
    try {
        const data = {
            favorites: Array.from(userFavorites),
            blockedCats: Array.from(blockedCats),
            preferredLangs: Array.from(PREFERRED_LANG_CODES),
            activeCat,
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) {
        console.warn('Save settings failed', e);
    }
}

function loadUserData() {
    try {
        const json = localStorage.getItem(STORAGE_KEY);
        if (!json) return;
        const data = JSON.parse(json);
        if (data.favorites) userFavorites = new Set(data.favorites);
        if (data.blockedCats) blockedCats = new Set(data.blockedCats);
        if (data.preferredLangs && Array.isArray(data.preferredLangs) && data.preferredLangs.length) {
            PREFERRED_LANG_CODES.clear();
            ALLOWED_LANG_CODES.clear();
            data.preferredLangs.forEach(code => {
                PREFERRED_LANG_CODES.add(code);
                ALLOWED_LANG_CODES.add(code);
            });
            // אם נשמרו רק שפות בלי עברית/אנגלית — מחזירים עברית (מצב שבור נפוץ)
            if (!PREFERRED_LANG_CODES.has('he') && !PREFERRED_LANG_CODES.has('en')) {
                PREFERRED_LANG_CODES.add('he');
                ALLOWED_LANG_CODES.add('he');
            }
        }
        if (data.activeCat) activeCat = data.activeCat;
    } catch (e) {
        console.warn('Load settings failed', e);
    }
}

// ============================================
// Event Listeners
// ============================================
document.addEventListener('click', (e) => {
    if (e.target.closest('.side-btn') || e.target.closest('.cat-pill') || e.target.closest('.modal-sheet') || e.target.closest('.header-settings-btn') || e.target.closest('#epg-fab') || e.target.closest('#channel-chip-source') || e.target.closest('.source-link')) return;
    showTopControls();
});

document.addEventListener('mousemove', showTopControls);
document.addEventListener('keydown', showTopControls);
document.addEventListener('wheel', showTopControls, { passive:true });
document.addEventListener('touchstart', showTopControls, { passive:true });

// ============================================
// Initialize
// ============================================
async function init() {
    loadUserData();
    const hadCache = loadHealthCache();
    customChannels = loadCustomChannels();
    cleanupVideoState();
    initSplashSources();
    updateSplash(hadCache ? 'טוען מאגרים (יש זיכרון סריקה)...' : 'מתחיל סריקת מאגרים...');
    
    const epgPromise = fetchEpgSources().catch(() => 0);
    const sources = await fetchAllSources();
    await epgPromise;
    
    const urls = new Set();
    const discovered = [...customChannels, ...sources].filter(ch => ch.url && !urls.has(ch.url) ? urls.add(ch.url) : false);
    discovered.forEach(ch => {
        if (ch.name && /group-title\s*=|tvg-/i.test(ch.name)) {
            ch.name = extractExtinfName(`#EXTINF:-1 tvg-name="${ch.tvgName || ''}" group-title="${ch.group || ''}",${ch.name}`, ch);
        }
        if (!ch.sourceLabel) {
            const def = getSourceDef(ch.sourceId);
            if (def) enrichChannelSource(ch, def);
        }
    });
    mergeChannels(discovered);
    
    updateSplash('מכין פיד...');
    filterAndRank();
    buildCatBar();
    buildSettingsModal();
    updateAutoScrollButton();
    updateCountdown();
    showTopControls();

    // אם יש ערוצים מהירים מהזיכרון — מציגים מיד בלי לחכות לסריקה
    if (filteredChannels.length) {
        document.getElementById('splash').classList.add('hide');
        renderSlides(true);
        updateHeaderPanel(0);
        feedBootstrapped = true;
        quietScanToasts = true;
        showToast(`${filteredChannels.length} ערוצים מוכנים`);
    } else {
        document.getElementById('splash').classList.add('hide');
        renderSlides(true);
    }
    
    setTimeout(() => startHealthScan(), 300);

    window.addEventListener('resize', () => {
        clearTimeout(window.__groveResizeTimer);
        window.__groveResizeTimer = setTimeout(() => {
            filterAndRank();
            if (!document.querySelector('.slide') && filteredChannels.length) renderSlides(true);
            updateHeaderPanel(Math.max(0, currentSlideIndex));
        }, 250);
    });
}

init();
</script>

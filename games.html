<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>SOS Play · פיד משחקים</title>
    <!-- חלק דף משחקים (games.html) – עיצוב פיד כמו הפיד הראשי + בקרות משחק | HYPER CORE TECH -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./styles/tokens.css">
    <link rel="stylesheet" href="./styles/base.css">
    <link rel="stylesheet" href="./styles/videos.css?v=20260728b">
    <link rel="stylesheet" href="./styles/games.css?v=20260728b">
</head>
<body class="games-page">
    <!-- סרגל עליון קבוע | HYPER CORE TECH -->
    <header class="games-top-bar">
        <button class="games-top-bar__btn" id="gamesBackBtn" type="button" aria-label="חזרה">
            <i class="fa-solid fa-chevron-right"></i>
        </button>
        <div class="games-top-bar__title">
            <i class="fa-solid fa-gamepad"></i>
            <span>SOS Play</span>
        </div>
        <button class="games-top-bar__btn" id="gamesMenuBtn" type="button" aria-label="תפריט משחקי רשת" aria-haspopup="true" aria-expanded="false">
            <i class="fa-solid fa-ellipsis-vertical"></i>
        </button>
        <div class="games-top-menu" id="gamesTopMenu" hidden>
            <button type="button" class="games-top-menu__item" data-games-action="doom">
                <i class="fa-solid fa-gun"></i>
                <span>משחק רשת דום</span>
            </button>
            <button type="button" class="games-top-menu__item" data-games-action="trivia">
                <i class="fa-solid fa-dice"></i>
                <span>משחק רשת טריוויה</span>
            </button>
        </div>
    </header>

    <!-- פיד משחקים – אותה מבנה כמו videos-feed (snap + game-embed) | HYPER CORE TECH -->
    <main class="videos-feed games-feed" aria-label="פיד משחקים משותפים">
        <div class="videos-feed__viewport games-feed__viewport" id="gamesViewport">
            <div class="videos-feed__stream" id="gamesStream" role="list">
                <!-- כרטיסי משחק יוזנו כאן -->
            </div>
        </div>
    </main>

    <div class="games-empty" id="gamesEmpty" hidden>
        <i class="fa-solid fa-gamepad"></i>
        <p>עדיין אין משחקים משותפים בפיד</p>
        <span>שתפו קישור משחק בפוסט — והוא יופיע כאן ובפיד הראשי</span>
    </div>

    <div class="games-indicator" id="gamesIndicator">
        <span class="games-indicator__current">0</span>
        <span class="games-indicator__separator">/</span>
        <span class="games-indicator__total">0</span>
    </div>

    <script src="./game-embed.js?v=20260728s"></script>
    <script src="./games.js?v=20260728s"></script>
</body>
</html>

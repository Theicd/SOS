<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SOS NETPLAY</title>
  <script>
    (function () {
      var hash = String(location.hash || '').replace(/^#/, '').toLowerCase();
      var launch = { nzp: 1, kart: 1, chess: 1, doom: 1, trivia: 1 };
      if (launch[hash]) {
        location.replace('./videos.html#' + hash);
        return;
      }
      var target = new URL('./netplay/index.html', location.href);
      if (new URLSearchParams(location.search).get('embedded') === '1') {
        target.searchParams.set('embedded', '1');
      }
      location.replace(target.href);
    })();
  </script>
</head>
<body></body>
</html>

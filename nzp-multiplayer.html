<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SOS זומבים</title>
  <style>
    :root {
      --sos-bg: #030a14;
      --sos-primary: #2d88ff;
      --sos-primary-hover: #1b5ecf;
      --sos-text: #f4f7fb;
      --sos-muted: #c5d0dc;
      --glass: rgba(6, 14, 24, .42);
      --glass-border: rgba(255, 255, 255, .16);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #030a14; color: var(--sos-text); font-family: "Segoe UI", system-ui, sans-serif; }
    body { overflow: hidden; }
    .stage { position: absolute; inset: 0; }
    .stage[hidden] { display: none !important; }

    .hero {
      position: relative;
      height: 100%;
      overflow: auto;
      background: #030a14;
    }
    .hero__blur {
      position: absolute;
      inset: -48px;
      background: url('./icons/nzp-cover.png') center 18% / cover no-repeat;
      filter: blur(34px) saturate(1.35) brightness(.42);
      transform: scale(1.12);
      z-index: 0;
    }
    .hero__vignette {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(3,10,20,.55) 0%, rgba(3,10,20,.18) 28%, rgba(3,10,20,.28) 58%, rgba(3,10,20,.88) 100%),
        radial-gradient(90% 80% at 50% 30%, rgba(90,0,0,.18), transparent 62%);
    }
    .hero__artwrap,
    .hero__art { display: none; }
    .hero__inner {
      position: relative;
      z-index: 2;
      min-height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: calc(20px + env(safe-area-inset-top, 0px)) 18px 24px;
    }
    .titlecard {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 22px 22px 20px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
    }
    .kicker {
      color: #d7e4f0;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .18em;
      margin-bottom: 12px;
      text-shadow: 0 2px 16px #000;
    }
    h1 {
      font-size: clamp(2.1rem, 4.2vw, 3.4rem);
      line-height: 1.05;
      margin-bottom: 14px;
      font-weight: 800;
      letter-spacing: -0.03em;
      text-shadow: 0 10px 40px rgba(0,0,0,.8);
    }
    .plot {
      color: #e8eef6;
      font-size: 16px;
      line-height: 1.65;
      max-width: 46ch;
      text-shadow: 0 4px 22px #000;
    }
    .board {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      margin-top: 28px;
    }
    .status {
      color: #d7e4f0;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
      min-height: 1.2em;
    }
    .dock,
    .rooms-wrap {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 20px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 16px 40px rgba(0,0,0,.32);
    }
    input {
      width: 100%;
      padding: 14px 14px;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      background: rgba(3, 10, 20, .45);
      color: var(--sos-text);
      font-size: 1rem;
      margin-bottom: 12px;
    }
    .row { display: flex; gap: 10px; }
    .row .btn { flex: 1; }
    .btn {
      border: 0;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 15px;
      cursor: pointer;
      color: #fff;
      background: var(--sos-primary);
      font-weight: 700;
    }
    .btn:hover { background: var(--sos-primary-hover); }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn-ghost {
      background: rgba(255,255,255,.1);
      color: #fff;
      border: 1px solid rgba(255,255,255,.18);
    }
    .btn-ghost:hover { background: rgba(255,255,255,.16); }
    .rooms-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .rooms { display: flex; flex-direction: column; gap: 10px; }
    .rooms-empty {
      color: var(--sos-muted);
      font-size: 14px;
      padding: 6px 0;
    }
    .room {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(3, 10, 20, .38);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 12px 12px 12px 14px;
    }
    .room__copy { min-width: 0; }
    .room__name { font-weight: 700; font-size: 15px; }
    .room__meta { color: var(--sos-muted); font-size: 12px; margin-top: 3px; }
    .room__join {
      flex-shrink: 0;
      border: 0;
      border-radius: 10px;
      padding: 9px 14px;
      background: var(--sos-primary);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    .room.full { opacity: .45; }
    .room.full .room__join { display: none; }
    .hint { margin-top: 14px; font-size: 12px; color: var(--sos-muted); text-shadow: 0 2px 10px #000; }

    .play { background: #000; }
    .game-frame { width: 100%; height: 100%; border: 0; display: block; }

    @media (min-width: 769px) {
      .hero { overflow: hidden; }
      .hero__artwrap {
        display: flex;
        position: absolute;
        left: 4%;
        top: 50%;
        transform: translateY(-50%);
        height: 86%;
        z-index: 2;
        align-items: center;
        justify-content: center;
        background: transparent;
      }
      .hero__art {
        display: block;
        height: 100%;
        width: auto;
        max-width: min(34vw, 420px);
        object-fit: contain;
        object-position: center center;
        filter: drop-shadow(0 28px 50px rgba(0,0,0,.7));
      }
      .hero__inner {
        width: min(560px, 46%);
        margin-right: 5%;
        margin-left: auto;
        justify-content: flex-start;
        padding: 48px 8px 48px 0;
        overflow: auto;
      }
      .board { margin-top: 32px; max-width: none; }
      .plot { font-size: 17px; }
    }
  </style>
</head>
<body>
  <section class="stage hero" id="lobbyStage">
    <div class="hero__blur" aria-hidden="true"></div>
    <div class="hero__vignette"></div>
    <div class="hero__inner">
      <div class="titlecard">
      <div class="kicker">SOS PLAY · קואופרטיב</div>
      <h1>Nazi Zombies: Portable</h1>
      <p class="plot">1945. חיילים נעולים בבונקר נאצי נטוש. המתים קמים, התחמושת אוזלת, ורק מי ששורד ביחד יוצא. עד 4 שחקנים באותה זירה — מחשב ומובייל.</p>
      </div>
      <div class="board">
      <div class="dock">
        <div class="status" id="lobbyStatus">מתחבר...</div>
        <input id="roomNameInput" maxlength="24" placeholder="שם החדר (רק למארח)">
        <div class="row">
          <button class="btn" id="btnHost" type="button">פתח חדר</button>
          <button class="btn btn-ghost" id="btnSolo" type="button">שחק לבד</button>
        </div>
      </div>
      <div class="rooms-wrap">
        <div class="rooms-title">חדרים פתוחים</div>
        <div class="rooms" id="roomsList"></div>
      </div>
      </div>
      <p class="hint">אם מישהו נכנס ולא נולד במפה: המארח לוחץ ~ ומקליד restart</p>
    </div>
    <div class="hero__artwrap">
      <img class="hero__art" src="./icons/nzp-cover.png" alt="">
    </div>
  </section>

  <section class="stage play" id="gameStage" hidden>
    <iframe class="game-frame" id="gameFrame" allow="autoplay; fullscreen; gamepad; keyboard-map" allowfullscreen></iframe>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/nostr-tools@2.7.2/lib/nostr.bundle.min.js"></script>
  <script>
    (function () {
      const GAME_URL = 'https://theicd.github.io/SOS010GAME01/web/index.html';
      const CFG = {
        TAG: 'sos_nzp_v1',
        KIND_STATUS: 33211,
        RELAYS: [
          'wss://relay.damus.io',
          'wss://nos.lol',
          'wss://relay.snort.social',
          'wss://relay.nostr.band'
        ],
        MAX_PLAYERS: 4,
        ROOM_TTL: 50
      };

      const state = {
        roomId: null,
        roomName: '',
        isHost: false,
        rooms: new Map(),
        processed: new Set(),
        pool: null,
        publicKey: null,
        privateKey: null,
        heartbeat: null,
        players: 1
      };

      const openerApp = window.opener?.NostrApp || window.parent?.NostrApp || {};
      const now = () => Math.floor(Date.now() / 1000);
      const lobbyStatus = document.getElementById('lobbyStatus');
      const roomsList = document.getElementById('roomsList');
      const roomNameInput = document.getElementById('roomNameInput');
      const btnHost = document.getElementById('btnHost');
      const btnSolo = document.getElementById('btnSolo');
      const lobbyStage = document.getElementById('lobbyStage');
      const gameStage = document.getElementById('gameStage');
      const gameFrame = document.getElementById('gameFrame');

      function getPlayerName() {
        return openerApp.profile?.name || openerApp.profile?.display_name || 'שחקן';
      }

      function fteName() {
        const ascii = String(getPlayerName()).replace(/[^\x20-\x7E]/g, '').replace(/["\\;]/g, '').trim();
        return (ascii || 'Player').slice(0, 15);
      }

      function createIceId() {
        return 'sos' + Math.random().toString(36).replace(/[^a-z0-9]/g, '').slice(2, 10);
      }

      function hexToBytes(hex) {
        const bytes = new Uint8Array(hex.length / 2);
        for (let i = 0; i < hex.length; i += 2) bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
        return bytes;
      }

      function openGame(params) {
        const url = new URL(GAME_URL);
        Object.keys(params || {}).forEach((key) => {
          if (params[key]) url.searchParams.set(key, params[key]);
        });
        url.searchParams.set('cb', '20260915nzp10');
        lobbyStage.hidden = true;
        gameStage.hidden = false;
        gameFrame.src = url.toString();
        try { window.parent.postMessage({ type: 'nzp-playing' }, '*'); } catch (_) {}
      }

      async function publishEvent(content) {
        if (!state.pool || !state.publicKey) return;
        const event = {
          kind: CFG.KIND_STATUS,
          pubkey: state.publicKey,
          created_at: now(),
          tags: [['t', CFG.TAG]],
          content: JSON.stringify(content)
        };
        try {
          let signed;
          if (state.privateKey) signed = window.NostrTools.finalizeEvent(event, state.privateKey);
          else if (typeof openerApp.signEvent === 'function') signed = await openerApp.signEvent(event);
          else return;
          state.pool.publish(CFG.RELAYS, signed);
        } catch (err) {
          console.warn('[NZP] publish', err);
        }
      }

      function publishHost() {
        publishEvent({
          type: 'host',
          room: state.roomId,
          roomName: state.roomName,
          name: getPlayerName(),
          players: state.players,
          max: CFG.MAX_PLAYERS,
          timestamp: now()
        });
      }

      function startHeartbeat() {
        if (state.heartbeat) clearInterval(state.heartbeat);
        publishHost();
        state.heartbeat = setInterval(publishHost, 8000);
      }

      function refreshRoomsList() {
        const rooms = Array.from(state.rooms.values()).filter((r) => now() - r.timestamp < CFG.ROOM_TTL);
        if (!rooms.length) {
          roomsList.innerHTML = '<p class="rooms-empty">אין חדרים פתוחים כרגע</p>';
          return;
        }
        roomsList.innerHTML = rooms.map((r) => {
          const full = r.players >= CFG.MAX_PLAYERS;
          const count = Math.min(r.players || 1, CFG.MAX_PLAYERS);
          const label = full ? 'מלא' : 'הצטרף';
          return `<div class="room${full ? ' full' : ''}" data-room="${r.roomId}" data-name="${r.roomName}">
            <div class="room__copy">
              <div class="room__name">${r.roomName}</div>
              <div class="room__meta">${count}/${CFG.MAX_PLAYERS} שחקנים · ${r.hostName}</div>
            </div>
            <button type="button" class="room__join" ${full ? 'disabled' : ''}>${label}</button>
          </div>`;
        }).join('');
        roomsList.querySelectorAll('.room:not(.full)').forEach((item) => {
          const join = () => joinRoom(item.dataset.room, item.dataset.name);
          item.addEventListener('click', join);
        });
      }

      function handleEvent(ev) {
        if (state.processed.has(ev.id)) return;
        state.processed.add(ev.id);
        let data;
        try { data = JSON.parse(ev.content); } catch (_) { return; }
        if (!data || !data.room) return;

        if (data.type === 'host') {
          state.rooms.set(data.room, {
            roomId: data.room,
            roomName: data.roomName || data.room,
            hostPubkey: ev.pubkey,
            hostName: data.name || 'שחקן',
            players: Number(data.players) || 1,
            timestamp: data.timestamp || now()
          });
          refreshRoomsList();
        }

        if (data.type === 'join' && data.room === state.roomId && state.isHost) {
          state.players = Math.min(CFG.MAX_PLAYERS, state.players + 1);
          lobbyStatus.textContent = `${data.name || 'שחקן'} מצטרף ל-${state.roomName}\n${state.players}/${CFG.MAX_PLAYERS}`;
          publishHost();
        }
      }

      function hostRoom() {
        const typed = String(roomNameInput.value || '').trim().slice(0, 24);
        state.roomName = typed || ('חדר של ' + getPlayerName());
        state.roomId = createIceId();
        state.isHost = true;
        state.players = 1;
        btnHost.disabled = true;
        lobbyStatus.textContent = `החדר "${state.roomName}" פתוח.`;
        startHeartbeat();
        openGame({
          sos: 'host',
          ice: state.roomId,
          name: fteName(),
          room: state.roomId
        });
      }

      function joinRoom(roomId, roomName) {
        state.roomId = roomId;
        state.isHost = false;
        lobbyStatus.textContent = `מצטרף ל-${roomName || roomId}...`;
        publishEvent({
          type: 'join',
          room: roomId,
          name: getPlayerName(),
          timestamp: now()
        });
        openGame({
          sos: 'join',
          ice: roomId,
          name: fteName()
        });
      }

      function startSolo() {
        openGame({});
      }

      function subscribe() {
        if (!state.pool) return;
        state.pool.subscribeMany(CFG.RELAYS, [{
          kinds: [CFG.KIND_STATUS],
          '#t': [CFG.TAG],
          since: now() - 90
        }], { onevent: handleEvent });
      }

      async function connectNostr() {
        const storedPrivKey = localStorage.getItem('nostr_private_key');
        const storedPubKey = localStorage.getItem('nostr_public_key');
        if (storedPrivKey && storedPrivKey.length === 64) {
          state.privateKey = hexToBytes(storedPrivKey);
          try { state.publicKey = window.NostrTools.getPublicKey(state.privateKey); }
          catch (_) { state.publicKey = storedPubKey; }
        } else if (storedPubKey) {
          state.publicKey = storedPubKey;
        }
        if (!state.publicKey && openerApp.publicKey) {
          state.publicKey = openerApp.publicKey;
          state.privateKey = openerApp.privateKey;
        }
        if (!state.publicKey) {
          state.privateKey = window.NostrTools.generateSecretKey();
          state.publicKey = window.NostrTools.getPublicKey(state.privateKey);
        }
        state.pool = new window.NostrTools.SimplePool();
      }

      async function init() {
        await connectNostr();
        if (state.pool && state.publicKey) {
          subscribe();
          lobbyStatus.textContent = 'מחובר. פתח חדר או היכנס לחדר פתוח.';
        } else {
          lobbyStatus.textContent = 'אין חיבור לרשת. אפשר לשחק לבד.';
        }
        refreshRoomsList();
        setInterval(refreshRoomsList, 5000);
      }

      btnHost.addEventListener('click', hostRoom);
      btnSolo.addEventListener('click', startSolo);
      roomNameInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') hostRoom();
      });

      function waitForNostrTools() {
        if (window.NostrTools) init();
        else setTimeout(waitForNostrTools, 100);
      }
      waitForNostrTools();
    })();
  </script>
</body>
</html>

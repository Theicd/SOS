<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SOS זומבים</title>
  <style>
    :root {
      --sos-bg: #030a14;
      --sos-electric: #00afff;
      --sos-text: #f4f7fb;
      --sos-muted: #8fa2b7;
      --sos-border: rgba(0, 175, 255, 0.35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--sos-bg); color: var(--sos-text); font-family: system-ui, sans-serif; }
    body { overflow: hidden; }
    .stage { position: absolute; inset: 0; }
    .stage[hidden] { display: none !important; }

    .hero {
      position: relative;
      height: 100%;
      overflow: auto;
      background: #030a14 url('./icons/nzp-cover.png') center / cover no-repeat;
    }
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(3,10,20,.28) 0%, rgba(3,10,20,.55) 38%, rgba(3,10,20,.96) 100%);
      pointer-events: none;
    }
    .hero__inner {
      position: relative;
      z-index: 1;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 28px 22px 28px;
      max-width: 720px;
    }
    .kicker {
      color: var(--sos-electric);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .14em;
      margin-bottom: 8px;
    }
    h1 { font-size: clamp(1.7rem, 4vw, 2.6rem); line-height: 1.1; margin-bottom: 10px; }
    .plot {
      color: var(--sos-muted);
      font-size: 15px;
      line-height: 1.55;
      max-width: 52ch;
      margin-bottom: 18px;
    }
    .status {
      background: rgba(6, 18, 32, .72);
      border: 1px solid var(--sos-border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
      white-space: pre-line;
      font-size: 14px;
    }
    input {
      width: 100%;
      max-width: 360px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--sos-border);
      background: rgba(3, 10, 20, .78);
      color: var(--sos-text);
      font-size: 1rem;
      margin-bottom: 10px;
    }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .btn {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 1rem;
      cursor: pointer;
      color: #031018;
      background: linear-gradient(180deg, #4dd4ff, #00afff);
      font-weight: 700;
    }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn-ghost {
      background: rgba(0, 175, 255, .12);
      color: var(--sos-text);
      border: 1px solid var(--sos-border);
    }
    .rooms { display: flex; flex-direction: column; gap: 8px; max-width: 420px; }
    .room {
      background: rgba(6, 18, 32, .78);
      border: 1px solid var(--sos-border);
      border-radius: 10px;
      padding: 12px;
      cursor: pointer;
    }
    .room:hover { border-color: #4dd4ff; }
    .room.full { opacity: .45; cursor: default; }
    .hint { margin-top: 12px; font-size: 12px; color: var(--sos-muted); }

    .play { background: #000; }
    .game-frame { width: 100%; height: 100%; border: 0; display: block; }
  </style>
</head>
<body>
  <section class="stage hero" id="lobbyStage">
    <div class="hero__inner">
      <div class="kicker">SOS PLAY · קואופרטיב</div>
      <h1>Nazi Zombies: Portable</h1>
      <p class="plot">1945. חיילים נעולים בבונקר נאצי נטוש. המתים קמים, התחמושת אוזלת, ורק מי ששורד ביחד יוצא. עד 4 שחקנים באותה זירה — מחשב ומובייל.</p>
      <div class="status" id="lobbyStatus">מתחבר...</div>
      <input id="roomNameInput" maxlength="24" placeholder="שם החדר (רק למארח)">
      <div class="row">
        <button class="btn" id="btnHost" type="button">פתח חדר</button>
        <button class="btn btn-ghost" id="btnSolo" type="button">שחק לבד</button>
      </div>
      <div class="rooms" id="roomsList"></div>
      <p class="hint">אם מישהו נכנס ולא נולד במפה: המארח לוחץ ~ ומקליד restart</p>
    </div>
  </section>

  <section class="stage play" id="gameStage" hidden>
    <iframe class="game-frame" id="gameFrame" allow="autoplay; fullscreen; gamepad; keyboard-map" allowfullscreen></iframe>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/nostr-tools@2.7.2/lib/nostr.bundle.min.js"></script>
  <script>
    (function () {
      const GAME_URL = 'https://theicd.github.io/SOS010GAME01/web/index.html';
      const CFG = {
        TAG: 'sos_nzp_v1',
        KIND_STATUS: 33211,
        RELAYS: [
          'wss://relay.damus.io',
          'wss://nos.lol',
          'wss://relay.snort.social',
          'wss://relay.nostr.band'
        ],
        MAX_PLAYERS: 4,
        ROOM_TTL: 50
      };

      const state = {
        roomId: null,
        roomName: '',
        isHost: false,
        rooms: new Map(),
        processed: new Set(),
        pool: null,
        publicKey: null,
        privateKey: null,
        heartbeat: null,
        players: 1
      };

      const openerApp = window.opener?.NostrApp || window.parent?.NostrApp || {};
      const now = () => Math.floor(Date.now() / 1000);
      const lobbyStatus = document.getElementById('lobbyStatus');
      const roomsList = document.getElementById('roomsList');
      const roomNameInput = document.getElementById('roomNameInput');
      const btnHost = document.getElementById('btnHost');
      const btnSolo = document.getElementById('btnSolo');
      const lobbyStage = document.getElementById('lobbyStage');
      const gameStage = document.getElementById('gameStage');
      const gameFrame = document.getElementById('gameFrame');

      function getPlayerName() {
        return openerApp.profile?.name || openerApp.profile?.display_name || 'שחקן';
      }

      function fteName() {
        const ascii = String(getPlayerName()).replace(/[^\x20-\x7E]/g, '').replace(/["\\;]/g, '').trim();
        return (ascii || 'Player').slice(0, 15);
      }

      function createIceId() {
        return 'sos' + Math.random().toString(36).replace(/[^a-z0-9]/g, '').slice(2, 10);
      }

      function hexToBytes(hex) {
        const bytes = new Uint8Array(hex.length / 2);
        for (let i = 0; i < hex.length; i += 2) bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
        return bytes;
      }

      function openGame(params) {
        const url = new URL(GAME_URL);
        Object.keys(params || {}).forEach((key) => {
          if (params[key]) url.searchParams.set(key, params[key]);
        });
        lobbyStage.hidden = true;
        gameStage.hidden = false;
        gameFrame.src = url.toString();
      }

      async function publishEvent(content) {
        if (!state.pool || !state.publicKey) return;
        const event = {
          kind: CFG.KIND_STATUS,
          pubkey: state.publicKey,
          created_at: now(),
          tags: [['t', CFG.TAG]],
          content: JSON.stringify(content)
        };
        try {
          let signed;
          if (state.privateKey) signed = window.NostrTools.finalizeEvent(event, state.privateKey);
          else if (typeof openerApp.signEvent === 'function') signed = await openerApp.signEvent(event);
          else return;
          state.pool.publish(CFG.RELAYS, signed);
        } catch (err) {
          console.warn('[NZP] publish', err);
        }
      }

      function publishHost() {
        publishEvent({
          type: 'host',
          room: state.roomId,
          roomName: state.roomName,
          name: getPlayerName(),
          players: state.players,
          max: CFG.MAX_PLAYERS,
          timestamp: now()
        });
      }

      function startHeartbeat() {
        if (state.heartbeat) clearInterval(state.heartbeat);
        publishHost();
        state.heartbeat = setInterval(publishHost, 8000);
      }

      function refreshRoomsList() {
        const rooms = Array.from(state.rooms.values()).filter((r) => now() - r.timestamp < CFG.ROOM_TTL);
        if (!rooms.length) {
          roomsList.innerHTML = '<p style="opacity:.6">אין חדרים פתוחים</p>';
          return;
        }
        roomsList.innerHTML = rooms.map((r) => {
          const full = r.players >= CFG.MAX_PLAYERS;
          const count = Math.min(r.players || 1, CFG.MAX_PLAYERS);
          return `<div class="room${full ? ' full' : ''}" data-room="${r.roomId}" data-name="${r.roomName}">
            ${r.roomName} · ${count}/${CFG.MAX_PLAYERS} · ${r.hostName}${full ? ' · מלא' : ''}
          </div>`;
        }).join('');
        roomsList.querySelectorAll('.room:not(.full)').forEach((item) => {
          item.addEventListener('click', () => joinRoom(item.dataset.room, item.dataset.name));
        });
      }

      function handleEvent(ev) {
        if (state.processed.has(ev.id)) return;
        state.processed.add(ev.id);
        let data;
        try { data = JSON.parse(ev.content); } catch (_) { return; }
        if (!data || !data.room) return;

        if (data.type === 'host') {
          state.rooms.set(data.room, {
            roomId: data.room,
            roomName: data.roomName || data.room,
            hostPubkey: ev.pubkey,
            hostName: data.name || 'שחקן',
            players: Number(data.players) || 1,
            timestamp: data.timestamp || now()
          });
          refreshRoomsList();
        }

        if (data.type === 'join' && data.room === state.roomId && state.isHost) {
          state.players = Math.min(CFG.MAX_PLAYERS, state.players + 1);
          lobbyStatus.textContent = `${data.name || 'שחקן'} מצטרף ל-${state.roomName}\n${state.players}/${CFG.MAX_PLAYERS}`;
          publishHost();
        }
      }

      function hostRoom() {
        const typed = String(roomNameInput.value || '').trim().slice(0, 24);
        state.roomName = typed || ('חדר של ' + getPlayerName());
        state.roomId = createIceId();
        state.isHost = true;
        state.players = 1;
        btnHost.disabled = true;
        lobbyStatus.textContent = `החדר "${state.roomName}" פתוח.`;
        startHeartbeat();
        openGame({
          sos: 'host',
          ice: state.roomId,
          name: fteName(),
          room: state.roomId
        });
      }

      function joinRoom(roomId, roomName) {
        state.roomId = roomId;
        state.isHost = false;
        lobbyStatus.textContent = `מצטרף ל-${roomName || roomId}...`;
        publishEvent({
          type: 'join',
          room: roomId,
          name: getPlayerName(),
          timestamp: now()
        });
        openGame({
          sos: 'join',
          ice: roomId,
          name: fteName()
        });
      }

      function startSolo() {
        openGame({});
      }

      function subscribe() {
        if (!state.pool) return;
        state.pool.subscribeMany(CFG.RELAYS, [{
          kinds: [CFG.KIND_STATUS],
          '#t': [CFG.TAG],
          since: now() - 90
        }], { onevent: handleEvent });
      }

      async function connectNostr() {
        const storedPrivKey = localStorage.getItem('nostr_private_key');
        const storedPubKey = localStorage.getItem('nostr_public_key');
        if (storedPrivKey && storedPrivKey.length === 64) {
          state.privateKey = hexToBytes(storedPrivKey);
          try { state.publicKey = window.NostrTools.getPublicKey(state.privateKey); }
          catch (_) { state.publicKey = storedPubKey; }
        } else if (storedPubKey) {
          state.publicKey = storedPubKey;
        }
        if (!state.publicKey && openerApp.publicKey) {
          state.publicKey = openerApp.publicKey;
          state.privateKey = openerApp.privateKey;
        }
        if (!state.publicKey) {
          state.privateKey = window.NostrTools.generateSecretKey();
          state.publicKey = window.NostrTools.getPublicKey(state.privateKey);
        }
        state.pool = new window.NostrTools.SimplePool();
      }

      async function init() {
        await connectNostr();
        if (state.pool && state.publicKey) {
          subscribe();
          lobbyStatus.textContent = 'מחובר. פתח חדר או היכנס לחדר פתוח.';
        } else {
          lobbyStatus.textContent = 'אין חיבור לרשת. אפשר לשחק לבד.';
        }
        refreshRoomsList();
        setInterval(refreshRoomsList, 5000);
      }

      btnHost.addEventListener('click', hostRoom);
      btnSolo.addEventListener('click', startSolo);
      roomNameInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') hostRoom();
      });

      function waitForNostrTools() {
        if (window.NostrTools) init();
        else setTimeout(waitForNostrTools, 100);
      }
      waitForNostrTools();
    })();
  </script>
</body>
</html>
